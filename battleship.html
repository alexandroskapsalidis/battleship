<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alexandros">
  <meta name="description" content="A Battleship game">
  <meta name="keywords" content="Battleship, JavaScript, Game, Ship, War">
  <link rel="icon" href="images/ship.png" type="image/x-icon">
  <title>Battleship</title>
  <style>
    body {
      background-color: black;
    }

    /* We're positioning this div relative, so that we can position the table 
    we add in the next step relative to this div */
    div#board {
      position: relative;
      width: 1024px;
      height: 863px;
      margin: auto;
      background: url("images/board.jpg") no-repeat;
      padding-bottom: 50px;
    }

    div#messageArea {
      position: absolute;
      top: 0px;
      left: 0px;
      color: rgb(83, 175, 19);
    }

    table {
      position: absolute;
      left: 173px;
      top: 98px;
      border-spacing: 0px;
    }

    td {
      width: 94px;
      height: 94px;
      color: aliceblue;
    }

    form {
      position: absolute;
      bottom: 0px;
      right: 0px;
      padding: 15px;
      background-color: rgb(83, 175, 19);
    }

    form input {
      background-color: rgb(152, 207, 113);
      border-color: rgb(83, 175, 19);
      font-size: 1em;
    }

    /* If an element is in the hit class, it gets the "ship.png" image. If the
    element is in the miss class, it gets the "miss.png" image in its background. */
    .hit {
      background: url("images/ship.png") no-repeat center center;
    }

    .miss {
      background: url("images/miss.png") no-repeat center center;
    }
  </style>
</head>

<body>
  <div id="board">
    <div id="messageArea">Message</div>
    <table>
      <tr>
        <td id="00"></td>
        <td id="01"></td>
        <td id="02"></td>
        <td id="03"></td>
        <td id="04"></td>
        <td id="05"></td>
        <td id="06"></td>
      </tr>
      <tr>
        <td id="10"></td>
        <td id="11"></td>
        <td id="12"></td>
        <td id="13"></td>
        <td id="14"></td>
        <td id="15"></td>
        <td id="16"></td>
      </tr>
      <tr>
        <td id="20"></td>
        <td id="21"></td>
        <td id="22"></td>
        <td id="23"></td>
        <td id="24"></td>
        <td id="25"></td>
        <td id="26"></td>
      </tr>
      <tr>
        <td id="30"></td>
        <td id="31"></td>
        <td id="32"></td>
        <td id="33"></td>
        <td id="34"></td>
        <td id="35"></td>
        <td id="36"></td>
      </tr>
      <tr>
        <td id="40"></td>

        <td id="42"></td>
        <td id="43"></td>
        <td id="44"></td>
        <td id="45"></td>
        <td id="46"></td>
      </tr>
      <tr>
        <td id="50"></td>

        <td id="52"></td>
        <td id="53"></td>
        <td id="54"></td>
        <td id="55"></td>
        <td id="56"></td>
      </tr>
      <tr>
        <td id="60"></td>

        <td id="62"></td>
        <td id="63"></td>
        <td id="64"></td>
        <td id="65"></td>
        <td id="66"></td>
      </tr>
    </table>
    <form>
      <input type="text" id="guessInput" placeholder="A0">
      <input type="button" id="fireButton" value="Fire!">
    </form>
  </div>

  <script src="battleship.js"></script>
</body>

</html>
